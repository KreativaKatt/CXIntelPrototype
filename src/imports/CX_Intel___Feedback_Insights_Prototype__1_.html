<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CX Intel — Feedback Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF3F3;--surface:#FFFFFF;--surface-2:#F4F8F8;--ink:#10292A;--ink-2:#4A6665;--ink-3:#748D8C;--line:#DCE7E7;
  --primary:#2D6160;--primary-hover:#133837;--on-primary:#FFFFFF;--primary-soft:#DDEEED;--primary-soft-ink:#1E4A49;
  --bar-track:#E3EDED;
  --b1:#133837;--b2:#2D6160;--b3:#437674;--b4:#91B5B4;--b5:#BCE0DE;
  --bt1:#FFFFFF;--bt2:#FFFFFF;--bt3:#FFFFFF;--bt4:#10292A;--bt5:#10292A;
  --neg:#B4500E;--neg-bg:#FDEFE2;--neg-line:#F5CFAB;--pos:#1D7650;--pos-bg:#E2F4EB;
  --hero:#133837;--hero-ink:#E8F6F5;--hero-mut:#9CC4C2;--hero-track:rgba(255,255,255,.14);--hero-fill:#DBFFFF;
  --s1:#133837;--s2:#E0782A;--s3:#6FBDB8;
  --shadow:0 1px 2px rgba(16,41,42,.05),0 14px 32px -18px rgba(16,41,42,.22);
  --r-lg:24px;--r-md:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1717;--surface:#112424;--surface-2:#163030;--ink:#E8F4F3;--ink-2:#A6C1BF;--ink-3:#7F9C9A;--line:#234141;
    --primary:#6FB9B5;--primary-hover:#93D2CE;--on-primary:#06201F;--primary-soft:#1B4140;--primary-soft-ink:#C3E8E5;
    --bar-track:#1B3636;
    --b1:#8FD0CC;--b2:#6BB5B1;--b3:#4F9794;--b4:#3A7371;--b5:#2B5957;
    --bt1:#06201F;--bt2:#06201F;--bt3:#06201F;--bt4:#E8F4F3;--bt5:#E8F4F3;
    --neg:#FFB073;--neg-bg:#3A2412;--neg-line:#62401F;--pos:#7EDDAC;--pos-bg:#173A2B;
    --hero:#173F3E;--hero-ink:#E8F6F5;--hero-mut:#A4CBC9;--hero-track:rgba(255,255,255,.14);--hero-fill:#DBFFFF;
    --s1:#8FD0CC;--s2:#F2A05A;--s3:#5FA8A5;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1717;--surface:#112424;--surface-2:#163030;--ink:#E8F4F3;--ink-2:#A6C1BF;--ink-3:#7F9C9A;--line:#234141;
  --primary:#6FB9B5;--primary-hover:#93D2CE;--on-primary:#06201F;--primary-soft:#1B4140;--primary-soft-ink:#C3E8E5;
  --bar-track:#1B3636;
  --b1:#8FD0CC;--b2:#6BB5B1;--b3:#4F9794;--b4:#3A7371;--b5:#2B5957;
  --bt1:#06201F;--bt2:#06201F;--bt3:#06201F;--bt4:#E8F4F3;--bt5:#E8F4F3;
  --neg:#FFB073;--neg-bg:#3A2412;--neg-line:#62401F;--pos:#7EDDAC;--pos-bg:#173A2B;
  --hero:#173F3E;--hero-ink:#E8F6F5;--hero-mut:#A4CBC9;--hero-track:rgba(255,255,255,.14);--hero-fill:#DBFFFF;
  --s1:#8FD0CC;--s2:#F2A05A;--s3:#5FA8A5;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.ic{flex:none;display:block}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;letter-spacing:-.02em;color:var(--primary-soft-ink);background:none;border:0;padding:0}
.brand b{font-weight:600}.brand span{font-weight:400}
.mark{width:30px;height:30px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:var(--hero-fill)}
.top-r{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary-soft-ink);border-color:transparent}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--primary-soft);color:var(--primary-soft-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 64px);padding:8px 16px 24px 20px;display:flex;flex-direction:column;justify-content:space-between}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:0;background:none;color:var(--ink-2);font-weight:500;font-size:15px;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:color-mix(in srgb,var(--primary-soft) 55%,transparent);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-soft-ink);font-weight:600}
.ai-note{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.45}
.ai-note .ic{color:var(--primary);margin-top:1px}
.main{padding:8px 36px 72px 16px;max-width:1240px;width:100%}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:10px 0 26px}
.ph-l{display:flex;gap:14px;align-items:flex-start;min-width:0}
.ph-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.back{margin-top:2px;flex:none}
h1{font-size:clamp(23px,2.7vw,32px);line-height:1.2;font-weight:600;letter-spacing:-.025em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;outline:none}
.crumb{background:none;border:0;padding:2px 6px;border-radius:10px;font:inherit;color:var(--ink-3);font-weight:500;letter-spacing:inherit}
button.crumb:hover{color:var(--ink);background:var(--primary-soft)}
.crumb.cur{color:var(--ink);font-weight:600}
.crumb.dots{display:inline-grid;place-items:center;padding:2px 8px}
.sep{color:var(--ink-3);display:inline-flex}
.editing{font-style:italic;font-weight:400;font-size:.66em;color:var(--ink-3);margin-left:10px;letter-spacing:0}
.sub{margin-top:6px;color:var(--ink-2);font-size:15.5px}
.sub.lead{font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
.conf{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary-soft-ink);font-size:13px}
.conf b{font-weight:700}
.shared-chip{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 8px;padding:6px 12px;border-radius:999px;background:var(--pos-bg);color:var(--pos);font-size:13px;font-weight:600}

/* ---------- buttons ---------- */
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;transition:background .15s,box-shadow .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.secondary{background:var(--primary-soft);color:var(--primary-soft-ink)}
.btn.secondary:hover{border-color:var(--primary)}
.btn.ghost{background:none;color:var(--ink-2);padding:0 12px}
.btn.ghost:hover{background:var(--primary-soft);color:var(--primary-soft-ink)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--primary)}
.btn:disabled,.chip:disabled,.step:disabled{opacity:.45;cursor:not-allowed}

/* ---------- cards & grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.stack{display:grid;gap:20px;align-content:start}
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow);min-width:0}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--b4)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.ct{font-size:17px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.ct.sm{font-size:15px}
.ct.lg{font-size:22px;letter-spacing:-.02em}
.cs{font-size:13px;color:var(--ink-3);margin-top:2px}
.chev{width:34px;height:34px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.card.link:hover .chev{background:var(--primary);color:var(--on-primary)}
.divider{height:1px;background:var(--line);margin:24px 0}

/* kpi (hero) */
.kpi{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-lg);padding:22px 26px;display:flex;align-items:center;gap:22px;min-width:0}
.kpi h2{font-size:16px;font-weight:600}
.kpi p{font-size:13.5px;color:var(--hero-mut);margin-top:4px;line-height:1.45}
.dn-t{stroke:var(--hero-track)}.dn-f{stroke:var(--hero-fill)}
.dn-v{fill:var(--hero-ink);font:600 26px 'DM Sans',sans-serif;letter-spacing:-.02em}
.insight{background:var(--primary-soft);color:var(--primary-soft-ink);border-radius:var(--r-lg);padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;border:0;cursor:pointer}
.insight:hover{box-shadow:inset 0 0 0 1.5px var(--primary)}
.insight .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.insight p{font-size:16px;line-height:1.45;font-weight:500;color:var(--ink)}
.insight .go{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}

/* ---------- bars ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(92px,156px) minmax(0,1fr) 54px;align-items:center;gap:14px;padding:4px 8px;margin:0 -8px;border-radius:14px;transition:background .12s}
.bars.nd .bar{grid-template-columns:minmax(92px,156px) minmax(0,1fr)}
.bar[role="link"]{cursor:pointer}
.bar[role="link"]:hover{background:var(--surface-2)}
.bl{font-size:13.5px;font-weight:500;color:var(--ink-2);line-height:1.25}
.bt{height:30px;border-radius:999px;background:var(--bar-track);overflow:hidden}
.bars.sm .bt{height:24px}
.bf{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;min-width:50px}
.bf em{font-style:normal;font-weight:700;font-size:12.5px}
.dl{font-size:12.5px;font-weight:600;text-align:right}
.dl.bad{color:var(--neg)}.dl.good{color:var(--pos)}
.r1{background:var(--b1);color:var(--bt1)}.r2{background:var(--b2);color:var(--bt2)}.r3{background:var(--b3);color:var(--bt3)}.r4{background:var(--b4);color:var(--bt4)}.r5{background:var(--b5);color:var(--bt5)}
[data-anim] .bf{animation:wipe .8s cubic-bezier(.2,.7,.2,1) both}
[data-anim] .dn-f{animation:dn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0 round 999px)}to{clip-path:inset(0 0 0 0 round 999px)}}
@keyframes dn{from{stroke-dashoffset:var(--c)}}

/* ---------- line chart ---------- */
.lc{position:relative}
.lc svg{width:100%;height:auto;display:block;touch-action:pan-y}
.ax{font:500 11px 'DM Sans',sans-serif;fill:var(--ink-3)}
.gl{stroke:var(--line);stroke-width:1}
.pt{opacity:0;transition:opacity .1s}.pt.on{opacity:1}
.cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--hero);color:var(--hero-ink);padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:2}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}
.legd{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legd i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px}

/* ---------- priority panel ---------- */
.pager{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.pager .icon-btn{width:34px;height:34px}
.pager .icon-btn:disabled{opacity:.4;cursor:not-allowed}
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{border:0;border-radius:18px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .15s,box-shadow .15s}
.pc:hover{box-shadow:0 0 0 2px var(--primary)}
.pc.feat{grid-column:1/-1;padding:22px 24px;border-radius:20px;gap:4px}
.pc .n{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.3}
.pc.feat .n{font-size:24px;letter-spacing:-.02em}
.pc .m{font-size:13px;opacity:.85}
.pc .p{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12.5px;font-weight:600;margin-top:10px}

/* ---------- toolbar / table ---------- */
.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:14px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:500;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button span{color:var(--ink-3);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,41,42,.12);font-weight:600}
.seg.icons button{padding:8px 10px}
.hint{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--primary-soft);color:var(--primary-soft-ink);font-size:14px;margin-bottom:18px;line-height:1.45}
.hint .ic{flex:none}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.prog i{display:block;width:96px;height:6px;border-radius:99px;background:var(--bar-track);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--primary);border-radius:99px}
.tbl-wrap{overflow-x:auto;margin:0 -8px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:780px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:focus-visible{outline-offset:-2px;border-radius:12px}
.rid{font-weight:600;color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.ent{background:var(--primary-soft);color:var(--primary-soft-ink);border-color:transparent}
.pill.needs::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ink-3)}
.pill.verified{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.pill.corrected{background:var(--primary-soft);color:var(--primary-soft-ink);border-color:transparent}
.mt{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.mt i{width:13px;height:6px;border-radius:3px;background:var(--bar-track)}
.mt i.on{background:var(--b3)}
.mt.hot i.on{background:var(--neg)}
.sent{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.face{color:var(--ink-2)}
.hot-face{color:var(--neg)}
.tend{text-align:right;color:var(--ink-3)}

/* review cards */
.rvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rvc{border:0;border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:190px;transition:box-shadow .15s}
.rvc:hover{box-shadow:0 0 0 2px var(--primary)}
.rq{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.rw{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.rvc .face{color:inherit}
.rf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;opacity:.92}
.vc{display:inline-flex;align-items:center;gap:2px;font-weight:600}
.empty{padding:48px 16px;text-align:center;color:var(--ink-3)}

/* ---------- detail ---------- */
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sgp{color:var(--pos)}.sgn{color:var(--neg)}
.sgb{width:26px;height:26px;border-radius:99px;border:0;padding:0;display:inline-grid;place-items:center;flex:none}
.sgb.sgp{background:var(--pos-bg)}.sgb.sgn{background:var(--neg-bg)}
button.sgb:hover{box-shadow:0 0 0 2px currentColor}
.tleg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mtip{position:fixed;left:0;top:0;z-index:90;max-width:270px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--hero);color:var(--hero-ink);display:flex;gap:10px;align-items:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
.mtip.on{opacity:1;visibility:visible}
.mtip b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mtip small{display:block;color:var(--hero-mut);font-size:12px;line-height:1.35}
mark[data-tag]{cursor:help}
mark[data-tag]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.addtag select{width:auto;flex:none;padding-right:10px}
.rv-text{font-size:17.5px;line-height:1.8;letter-spacing:-.005em}
mark{background:none;color:inherit;border-radius:6px;padding:1px 4px;margin:0 -1px}
mark.pos{background:var(--pos-bg);color:var(--pos);font-weight:600;border-bottom:2px solid var(--pos);border-radius:6px 6px 0 0}
mark.neg{background:var(--neg-bg);color:var(--neg);font-weight:600;text-decoration:underline wavy var(--neg);text-decoration-thickness:1.5px;text-underline-offset:4px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.trow:last-of-type{border-bottom:0}
.thead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink-3);padding-bottom:8px;border-bottom:1px solid var(--line)}
.tg{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:5px 10px;border-radius:10px;font-weight:600;font-size:13.5px}
.tg button{border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink-3);border-radius:99px}
.tg button:hover{color:var(--neg)}
.cat{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px}
.cat i{width:8px;height:8px;border-radius:99px}
.addtag{display:flex;gap:8px;margin-top:14px}
input[type=text],input:not([type]),select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.prof{display:grid;gap:14px}
.prof div{display:grid;gap:2px}
.prof dt{font-size:12.5px;color:var(--ink-3)}
.prof dd{margin:0;font-weight:600;font-size:14.5px}
.int{background:var(--primary-soft);border-color:transparent}
.int.hot{background:var(--neg-bg);border-color:var(--neg-line)}
.int-main{display:flex;align-items:center;gap:18px}
.face-c{width:68px;height:68px;border-radius:99px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.hot .face-c{color:var(--neg)}
.big{font-size:54px;font-weight:600;letter-spacing:-.04em;line-height:1}
.big small{font-size:22px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.il{font-weight:600;margin-top:6px;color:var(--ink)}
.hot .il{color:var(--neg)}
.m5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px}
.m5 i,.m5 button{display:block;height:10px;border-radius:99px;background:var(--surface);border:0;padding:0}
.m5 .on{background:var(--b3)}
.hot .m5 .on{background:var(--neg)}
.m5 button{height:16px;background:none;position:relative}
.m5 button::after{content:"";position:absolute;left:0;right:0;top:3px;height:10px;border-radius:99px;background:var(--surface)}
.m5 button.on::after{background:var(--b3)}
.hot .m5 button.on::after{background:var(--neg)}
.stepper{display:flex;gap:8px;margin-left:auto}
.step{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--neg-line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.step:hover:not(:disabled){border-color:var(--neg)}
.ai-r{background:var(--primary-soft);border-color:transparent;box-shadow:none}
.hot-r{background:var(--neg-bg);border-color:var(--neg-line)}
.ai-r p{font-size:14.5px;line-height:1.7;color:var(--ink)}
.ai-r .ct{display:flex;align-items:center;gap:8px}
.note{font-size:13px;color:var(--ink-2);margin-top:12px}

/* ---------- report ---------- */
.rep p.body{font-size:16.5px;line-height:1.75}
.act{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.act:last-child{border-bottom:0;padding-bottom:0}
.act:first-of-type{padding-top:0}
.k{display:inline-flex;justify-content:center;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-soft-ink);font-size:12.5px;font-weight:600;margin-top:2px}
.act p{line-height:1.6}
.team{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.team:last-child{border-bottom:0;padding-bottom:0}
.team:first-of-type{padding-top:0}
.team b{font-weight:600;display:block}
.team span.h{color:var(--ink-2);font-size:13.5px}
.pp{border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;background:var(--primary-soft);color:var(--primary-soft-ink);min-width:44px}
.pp.p0{background:var(--neg-bg);color:var(--neg)}
button.pp:hover{box-shadow:0 0 0 2px var(--primary)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cb{min-width:0;position:relative}
.cb .ct{font-size:14.5px;margin-bottom:14px;min-height:38px}
.swap{position:absolute;right:0;top:-4px;display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--b4);background:var(--surface);color:var(--primary-soft-ink);border-radius:10px;padding:5px 10px;font-weight:600;font-size:12.5px}
.swap:hover{background:var(--primary-soft)}
[contenteditable="true"]{outline:1.5px dashed var(--b4);outline-offset:6px;border-radius:6px;cursor:text}
[contenteditable="true"]:focus{outline:2px solid var(--primary)}
.revising{opacity:.45;transition:opacity .2s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.chip:hover:not(:disabled){border-color:var(--primary);color:var(--primary-soft-ink)}
.askrow{display:flex;gap:8px}

.scrim{position:fixed;inset:0;background:rgba(6,20,20,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:60}

.dlg label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.chipbox{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:8px}
.chipbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chipbox input{flex:1;min-width:140px;border:0;padding:6px;box-shadow:none!important}
.people{margin-top:18px;border-top:1px solid var(--line)}
.prow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow span{color:var(--ink-3)}
.dlg-f{display:flex;align-items:center;gap:10px;margin-top:22px}
.sp{flex:1}
.gen{text-align:center;padding:36px 32px}
.gen .cs{margin-top:8px;min-height:20px;font-size:14px}
.spin{animation:spin 1s linear infinite;color:var(--primary);margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.gbar{height:6px;border-radius:99px;background:var(--bar-track);margin-top:22px;overflow:hidden}
.gbar i{display:block;height:100%;width:100%;background:var(--primary);transform-origin:left;animation:fill 2.6s linear both}
@keyframes fill{from{transform:scaleX(0)}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--hero);color:var(--hero-ink);padding:13px 18px;border-radius:14px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty-state{display:grid;place-items:center;text-align:center;padding:72px 24px;gap:10px}
.empty-state .face-c{background:var(--primary-soft);color:var(--primary)}

/* ---------- responsive ---------- */
@media (max-width:1100px){

  .main{padding-right:24px}
}
@media (max-width:860px){

  .ai-note{display:none}
  .nav{grid-template-columns:repeat(4,1fr);gap:2px}

  .main{padding:4px 16px 120px}
  .top{padding:0 16px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .ph{flex-direction:column;gap:14px}
  .ph-r{justify-content:flex-start}
  .duo,.charts{grid-template-columns:1fr}
  .card{padding:20px}
  .bar{grid-template-columns:minmax(84px,120px) minmax(0,1fr) 46px;gap:10px}
  .bars.nd .bar{grid-template-columns:minmax(84px,120px) minmax(0,1fr)}
  .act{grid-template-columns:1fr;gap:6px}
  .kpi{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  let title,body;
  if(slot===1){
    if(o===0){title='Billing negative sentiment (% of billing reviews)';body=line('rep-trend',{labels:WEEKS,min:30,max:60,ticks:[30,40,50,60],area:true,h:210,series:[{name:'Negative sentiment',color:'var(--s1)',data:TREND}],aria:'Billing negative sentiment rising from 38 to 52 percent over eight weeks'});}
    else{title='Billing mentions per week';body=bars(WEEKS.map((w,i)=>({label:w,v:WEEKMENT[i]})),{cls:'sm'});}
  }else{
    if(o===0){title='Top billing root causes (mentions)';body=bars(TAGS.billing.slice(0,5).map(t=>({label:t.name,v:t.n})),{cls:'sm'});}
    else{title='Negative sentiment by customer tier';body=bars([{label:'Enterprise',v:46,u:'%'},{label:'Professional',v:31,u:'%'},{label:'Starter',v:23,u:'%'}],{cls:'sm'});}
  }
  return `<div class="cb"><h3 class="ct">${title}</h3>${state.reportEditing?`<button class="swap" data-act="swap" data-slot="${slot}">${ic('swap',14)}Swap chart</button>`:''}${body}</div>`;
}
function vReport(){
  const ed=state.reportEditing,d=ed?state.rdraft:report;
  const crumbs=state.crumbsOpen?fullTrail().concat([{l:'Report'}]):[{toggle:true},{l:'Report'}];
  const actions=ed?`<button class="btn secondary" data-act="report-cancel">Cancel</button><button class="btn primary" data-act="report-save">${ic('check',18)}Save changes</button>`:`<button class="btn secondary" data-act="report-edit">${ic('edit',18)}Edit</button><button class="btn primary" data-act="share-open">${ic('share',18)}Share</button>`;
  const ce=ed?'contenteditable="true" spellcheck="true"':'';
  const teamRows=d.teams.map((t,i)=>`<div class="team"><div><b>${esc(t.team)}</b><span class="h" ${ed?`contenteditable="true" data-edit="handle-${i}"`:''}>${esc(t.handle)}</span></div>${ed?`<button class="pp p${t.p}" data-act="prio" data-i="${i}" aria-label="Priority P${t.p}. Select to change">P${t.p}</button>`:`<span class="pp p${t.p}">P${t.p}</span>`}</div>`).join('');
  const acts=d.actions.map((a,i)=>`<div class="act"><span class="k">${a.k}</span><p ${ce} ${ed?`data-edit="action-${i}"`:''}>${esc(a.t)}</p></div>`).join('');
  const revise=ed?`<section class="card"><div class="ch" style="margin-bottom:0"><div><h2 class="ct">${ic('spark',18,'')} Revise with AI</h2><p class="cs">Ask for a change to the summary. You can go back and forth, and your own edits always win.</p></div></div>
    <div class="chips"><button class="chip" data-act="revise" data-k="short" ${state.revising?'disabled':''}>Make it shorter</button><button class="chip" data-act="revise" data-k="revenue" ${state.revising?'disabled':''}>Emphasize revenue risk</button><button class="chip" data-act="revise" data-k="undo" ${d.prev&&!state.revising?'':'disabled'}>Undo last revision</button></div>
    <div class="askrow"><input id="askIn" placeholder="e.g. Focus on Enterprise customers" aria-label="Ask the AI to revise the summary"><button class="btn primary sm" data-act="revise" data-k="custom" ${state.revising?'disabled':''}>${state.revising?'Revising…':'Send'}</button></div><p class="note">Prototype preview: AI revisions are simulated.</p></section>`:'';
  return head({back:true,crumbs,editing:ed,sub:'Strategy Report Q1: Billing Friction &amp; Churn Mitigation',subCls:'lead',actions,
    extra:`<div><span class="conf"><b>${d.confidence}% confidence</b> based on 450+ verified data points</span>${state.shared?`<span class="shared-chip">${ic('check',14)}Shared with ${state.shared.length} ${state.shared.length===1?'recipient':'recipients'}</span>`:''}<p class="cs" style="margin-top:8px">${d.date}</p></div>`})+`
  <div class="grid rep">
    <div class="stack s7">
      <section class="card"><div class="ch"><h2 class="ct">Executive summary</h2></div><p class="body ${state.revising?'revising':''}" ${ce} ${ed?'data-edit="summary"':''}>${esc(d.summary)}</p></section>
      ${revise}
      <section class="card"><div class="charts">${chartSlot(1)}${chartSlot(2)}</div></section>
    </div>
    <div class="stack s5">
      <section class="card"><div class="ch"><h2 class="ct">Proposed action</h2></div>${acts}</section>
      <section class="card"><div class="ch"><div><h2 class="ct">Suggested team assignments</h2>${ed?'<p class="cs">Select a priority to change it</p>':''}</div></div>${teamRows}</section>
    </div>
  </div>`;
}
function vEmpty(kind){
  const g=kind==='inbox';
  return head({back:true,title:g?'Inbox':'Growth'})+`<section class="card empty-state"><span class="face-c">${ic(g?'inbox':'growth',30)}</span><h2 class="ct lg">${g?'Your inbox is clear':'Growth insights are coming soon'}</h2><p class="cs" style="max-width:380px;font-size:14.5px">${g?'Shared reports and team assignments will appear here once you share a strategy report.':'Positive feedback themes and expansion opportunities will show up here. This area is outside the current prototype.'}</p><button class="btn primary" style="margin-top:12px" data-act="go" data-view="dashboard">Back to dashboard</button></section>`;
}
function topbar(){
  const dark=effTheme()==='dark';
  return `<div class="top"><button class="brand" data-act="go" data-view="dashboard" aria-label="CX Intel home"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-8 4 14 3-6h4"/></svg></span><span><b>CX</b> <span>Intel</span></span></button>
  <div class="top-r"><button class="icon-btn" data-act="theme" aria-label="Switch to ${dark?'light':'dark'} theme">${ic(dark?'sun':'moon',18)}</button><span class="avatar" aria-label="Product manager account">PM</span></div></div>`;
}
function sidebar(){
  const act={dashboard:'dashboard',issues:'issues',category:'issues',tag:'issues',detail:'issues',report:'issues',growth:'growth',inbox:'inbox'}[state.view];
  const it=(v,l,i)=>`<button data-act="go" data-view="${v}" ${act===v?'aria-current="page"':''}>${ic(i,20)}${l}</button>`;
  return `<aside class="side"><nav class="nav" aria-label="Primary">${it('dashboard','Home','home')}${it('issues','Issues','issues')}${it('growth','Growth','growth')}${it('inbox','Inbox','inbox')}</nav><div class="ai-note">${ic('spark',18)}<span>AI suggests, you decide. Every tag, score and report line stays editable.</span></div></aside>`;
}
function page(){
  switch(state.view){
    case 'dashboard':return vDashboard();
    case 'issues':return vIssues();
    case 'category':return vCategory();
    case 'tag':return vTag();
    case 'detail':return vDetail();
    case 'report':return vReport();
    case 'growth':return vEmpty('growth');
    case 'inbox':return vEmpty('inbox');
  }
}
function render(){
  document.getElementById('app').innerHTML=`${topbar()}<div class="shell">${sidebar()}<main class="main" id="main" ${state.anim?'data-anim':''}>${page()}</main></div>`;
  state.anim=false;hideMtip();
}
function nav(view,p){
  Object.assign(state,{view,editing:false,draft:null,reportEditing:false,rdraft:null,crumbsOpen:false,anim:true,page:0});
  if(view==='tag') state.filter='all';
  if(p) Object.assign(state,p);
  render();
  window.scrollTo({top:0});
  const h=document.getElementById('h1');if(h)h.focus({preventScroll:true});
}
function backTarget(){
  return {issues:['dashboard'],category:['issues'],tag:['category'],detail:['tag'],report:['tag'],growth:['dashboard'],inbox:['dashboard']}[state.view];
}

/* ================= theme ================= */
function effTheme(){const t=document.documentElement.dataset.theme;if(t)return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}

/* ================= toast & layer ================= */
let tt;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=ic('check',18)+'<span>'+esc(msg)+'</span>';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3400);}
const layer=()=>document.getElementById('layer');
function openLayer(html){const l=layer();l.innerHTML=html;const f=l.querySelector('input,button');if(f)f.focus();}
function closeLayer(){layer().innerHTML='';state.busy=false;}

/* ================= detail editing ================= */
function startEdit(){const r=REVIEWS[state.reviewId];state.editing=true;state.draft={tags:r.tags.map(t=>t.slice()),intensity:r.intensity};render();}
function saveEdit(){
  const r=REVIEWS[state.reviewId],d=state.draft;
  const changed=JSON.stringify(r.tags)!==JSON.stringify(d.tags)||r.intensity!==d.intensity;
  r.tags=d.tags;r.intensity=d.intensity;if(changed)r.status='Corrected';
  nav('tag');
  toast(changed?'Correction saved. The report will use your tags and score.':'No changes to save.');
}
function addTag(){
  const inp=document.getElementById('tagIn');if(!inp)return;
  const v=inp.value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
  if(!v)return;
  if(state.draft.tags.some(t=>t[0]===v)){toast('That tag is already on this review.');return;}
  const se=document.getElementById('tagSent');state.draft.tags.push([v,TAGCAT[v]||'Custom',se&&se.value==='pos'?'pos':'neg']);render();
  const n=document.getElementById('tagIn');if(n)n.focus();
}

/* ================= report editing ================= */
function syncReport(){
  if(!state.reportEditing||!state.rdraft)return;
  const d=state.rdraft,q=s=>document.querySelector(s);
  const s=q('[data-edit="summary"]');if(s)d.summary=s.innerText.trim();
  d.actions.forEach((a,i)=>{const n=q(`[data-edit="action-${i}"]`);if(n)a.t=n.innerText.trim();});
  d.teams.forEach((t,i)=>{const n=q(`[data-edit="handle-${i}"]`);if(n)t.handle=n.innerText.trim();});
}
function revise(k){
  syncReport();const d=state.rdraft;
  if(k==='undo'){if(d.prev){d.summary=d.prev;d.prev=null;render();}return;}
  const inp=document.getElementById('askIn');const txt=inp&&inp.value?inp.value.trim():'';
  if(k==='custom'&&!txt){toast('Type what you want changed first.');return;}
  state.revising=true;render();
  setTimeout(()=>{
    d.prev=d.summary;
    if(k==='short') d.summary="Negative billing sentiment is up 15% in 30 days, driven by slow refund processing and automated support loops. Enterprise users are hit hardest, putting roughly $45k MRR at risk if this isn't fixed next sprint.";
    else if(k==='revenue') d.summary="Billing friction puts about $45k MRR at risk. Negative sentiment rose 15% in the last 30 days, and Enterprise customers, the most exposed segment, cite slow refunds and automated support loops as reasons to reconsider their renewal. Fixing this next sprint protects the accounts most likely to churn.";
    else d.summary=d.summary.replace(/\s*\(Revised.*?\)\s*$/,'')+" (Revised to reflect: “"+txt+"”.)";
    state.revising=false;render();
  },800);
}
function reportSave(){
  syncReport();
  report=JSON.parse(JSON.stringify(state.rdraft));
  state.reportEditing=false;state.rdraft=null;render();toast('Report changes saved.');
}

/* ================= generate & share ================= */
function generate(){
  const steps=['Reading verified reviews…','Grouping root causes…','Drafting suggested actions…'];
  state.busy=true;
  openLayer(`<div class="scrim"><div class="dlg gen" role="alertdialog" aria-modal="true" aria-labelledby="gt"><svg class="spin ic" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg><h2 id="gt" class="ct lg">Generating your report</h2><p id="gs" class="cs">${steps[0]}</p><div class="gbar"><i></i></div></div></div>`);
  let i=0;const t=setInterval(()=>{i++;const p=document.getElementById('gs');if(i<steps.length){if(p)p.textContent=steps[i];}else{clearInterval(t);closeLayer();nav('report');}},880);
}
function shareHTML(){
  const s=state.share;
  const chips=s.recips.map((r,i)=>`<span class="tg">${esc(r)}<button data-act="rc-del" data-i="${i}" aria-label="Remove ${esc(r)}">${ic('x',14)}</button></span>`).join('');
  const who={view:'Can view',comment:'Can comment',edit:'Can edit'}[s.access];
  return `<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="ch" style="margin-bottom:4px"><div><h2 id="dt" class="ct lg">Share strategy report</h2><p class="cs">Q1 Billing Friction &amp; Churn Mitigation</p></div><button class="icon-btn" data-act="close-layer" aria-label="Close">${ic('x',18)}</button></div>
    <label class="lbl" for="rIn">Share with</label><div class="chipbox">${chips}<input id="rIn" placeholder="Add a person or team" autocomplete="off"></div>
    <label class="lbl" for="acc">Access</label><select id="acc"><option value="view" ${s.access==='view'?'selected':''}>Can view</option><option value="comment" ${s.access==='comment'?'selected':''}>Can comment</option><option value="edit" ${s.access==='edit'?'selected':''}>Can edit</option></select>
    <label class="lbl" for="msg">Message</label><textarea id="msg" rows="3">${esc(s.msg)}</textarea>
    <div class="people" aria-label="People with access"><div class="prow"><b>You (Product Manager)</b><span>Owner</span></div>${s.recips.map(r=>`<div class="prow"><b>${esc(r)}</b><span>${who}</span></div>`).join('')}</div>
    <div class="dlg-f"><button class="btn ghost" data-act="copy-link">${ic('link',18)}Copy link</button><span class="sp"></span><button class="btn secondary" data-act="close-layer">Cancel</button><button class="btn primary" data-act="do-share">Share report</button></div></div></div>`;
}
function readShare(){const s=state.share;const a=document.getElementById('acc'),m=document.getElementById('msg');if(a)s.access=a.value;if(m)s.msg=m.value;}
function openShare(){
  syncReport();
  state.share=state.share||{recips:report.teams.map(t=>t.handle),access:'view',msg:"Here's the Q1 billing friction report. Please review the actions assigned to your team."};
  openLayer(shareHTML());
}
function addRecipient(){
  const i=document.getElementById('rIn');if(!i)return;const v=i.value.trim();if(!v)return;
  readShare();const r=v.startsWith('@')||v.includes('@')?v:'@'+v.replace(/\s+/g,'');
  if(!state.share.recips.includes(r))state.share.recips.push(r);
  layer().innerHTML=shareHTML();const n=document.getElementById('rIn');if(n)n.focus();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const mk=markOf(e);if(mk){showMtip(mk);return;}
  hideMtip();
  const sc=e.target.closest('.scrim');
  if(sc&&e.target===sc&&!state.busy){closeLayer();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':{const p={};if(d.cat)p.cat=d.cat;if(d.tag)p.tag=d.tag;if(d.id)p.reviewId=d.id;nav(d.view,p);break;}
    case 'back':{const t=backTarget();if(t)nav(t[0]);break;}
    case 'crumbs':state.crumbsOpen=!state.crumbsOpen;render();break;
    case 'theme':document.documentElement.dataset.theme=effTheme()==='dark'?'light':'dark';render();break;
    case 'page':state.page=Math.max(0,state.page+Number(d.d));render();break;
    case 'filter':state.filter=d.k;render();break;
    case 'lview':state.listView=d.k;render();break;
    case 'generate':generate();break;
    case 'edit':startEdit();break;
    case 'cancel-edit':state.editing=false;state.draft=null;render();break;
    case 'save-edit':saveEdit();break;
    case 'tag-del':state.draft.tags.splice(Number(d.i),1);render();break;
    case 'tag-add':addTag();break;
    case 'tag-sent':{const t=state.draft.tags[Number(d.i)];t[2]=t[2]==='pos'?'neg':'pos';render();break;}
    case 'int-set':state.draft.intensity=Number(d.v);render();break;
    case 'int-inc':state.draft.intensity=Math.min(5,state.draft.intensity+1);render();break;
    case 'int-dec':state.draft.intensity=Math.max(1,state.draft.intensity-1);render();break;
    case 'report-edit':state.reportEditing=true;state.rdraft=JSON.parse(JSON.stringify(report));render();break;
    case 'report-cancel':state.reportEditing=false;state.rdraft=null;state.slot1=0;state.slot2=0;render();break;
    case 'report-save':reportSave();break;
    case 'swap':syncReport();if(d.slot==='1')state.slot1=1-state.slot1;else state.slot2=1-state.slot2;render();break;
    case 'prio':syncReport();{const t=state.rdraft.teams[Number(d.i)];t.p=(t.p+1)%3;}render();break;
    case 'revise':revise(d.k);break;
    case 'share-open':openShare();break;
    case 'close-layer':closeLayer();break;
    case 'rc-del':readShare();state.share.recips.splice(Number(d.i),1);layer().innerHTML=shareHTML();break;
    case 'copy-link':
      try{navigator.clipboard.writeText(location.href).then(()=>toast('Link copied.'),()=>toast('Copy isn’t available here. Copy the address from your browser.'));}
      catch(_){toast('Copy isn’t available here. Copy the address from your browser.');}
      break;
    case 'do-share':{
      readShare();const s=state.share;
      if(!s.recips.length){toast('Add at least one person or team.');return;}
      state.shared=s.recips.slice();closeLayer();render();toast('Report shared with '+s.recips.join(', ')+'.');break;
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideMtip();}
  if(e.key==='Escape'&&layer().innerHTML&&!state.busy){closeLayer();return;}
  const t=e.target;
  if(e.key==='Enter'){
    if(t.id==='tagIn'){e.preventDefault();addTag();return;}
    if(t.id==='rIn'){e.preventDefault();addRecipient();return;}
    if(t.id==='askIn'){e.preventDefault();revise('custom');return;}
  }
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('tr[data-act],div[data-act],section[data-act]')){e.preventDefault();t.click();}
});
document.addEventListener('input',e=>{if(e.target.id==='tagIn'){const v=e.target.value.trim().toLowerCase();const se=document.getElementById('tagSent');if(se&&TAGCAT[v])se.value=TAGSENT[v]||'neg';}});
/* keyword tooltips */
function hideMtip(){const t=document.getElementById('mtip');if(t)t.classList.remove('on');}
function showMtip(m){
  const t=document.getElementById('mtip');if(!t||state.view!=='detail'||!REVIEWS[state.reviewId])return;
  const r=REVIEWS[state.reviewId],tags=state.editing&&state.draft?state.draft.tags:r.tags;
  const tg=tags.find(x=>x[0]===m.dataset.tag);
  if(tg){const pos=tg[2]==='pos';t.innerHTML=`<span class="sgb ${pos?'sgp':'sgn'}">${ic(pos?'up':'down',15)}</span><span><small>Tag</small><b>${esc(tg[0])}</b><small>${esc(tg[1])} category, ${pos?'positive':'negative'}</small></span>`;}
  else t.innerHTML=`<span><small>No matching tag</small><b>${esc(m.dataset.tag)}</b><small>This tag was removed from the review</small></span>`;
  const rc=m.getBoundingClientRect(),tr=t.getBoundingClientRect(),vw=document.documentElement.clientWidth;
  let x=rc.left+rc.width/2-tr.width/2;x=Math.max(8,Math.min(x,vw-tr.width-8));
  let y=rc.top-tr.height-10;if(y<8)y=rc.bottom+10;
  t.style.transform=`translate(${x}px,${y}px)`;t.classList.add('on');
}
const markOf=e=>e.target&&e.target.closest?e.target.closest('mark[data-tag]'):null;
document.addEventListener('pointerover',e=>{const m=markOf(e);if(m)showMtip(m);});
document.addEventListener('pointerout',e=>{if(markOf(e))hideMtip();});
document.addEventListener('focusin',e=>{const m=markOf(e);if(m)showMtip(m);});
document.addEventListener('focusout',e=>{if(markOf(e))hideMtip();});
document.addEventListener('scroll',hideMtip,true);
/* line chart hover */
document.addEventListener('pointermove',e=>{
  const lc=e.target.closest&&e.target.closest('.lc');
  document.querySelectorAll('.lc').forEach(n=>{if(n!==lc){n.querySelectorAll('.pt.on').forEach(p=>p.classList.remove('on'));const tp=n.querySelector('.tip');if(tp)tp.classList.remove('on');}});
  if(!lc)return;
  const o=CH[lc.dataset.chart];if(!o)return;
  const svg=lc.querySelector('svg'),rect=svg.getBoundingClientRect();
  const W=Number(lc.dataset.w),pl=Number(lc.dataset.pl),iw=Number(lc.dataset.iw),n=o.labels.length;
  const px=(e.clientX-rect.left)/rect.width*W;
  const i=Math.max(0,Math.min(n-1,Math.round((px-pl)/iw*(n-1))));
  lc.querySelectorAll('.pt').forEach(p=>p.classList.toggle('on',Number(p.dataset.i)===i));
  const tip=lc.querySelector('.tip'),xi=(pl+iw*i/(n-1))/W*100;
  tip.style.left=`clamp(70px,${xi}%,calc(100% - 70px))`;
  tip.innerHTML=`<b>${o.labels[i]==='Today'?'Today':(/^\d+$/.test(o.labels[i])?'Day '+o.labels[i]:o.labels[i])}</b>`+o.series.map(s=>`<div><i style="background:${s.color}"></i>${s.name}: ${s.data[i]}${o.unit||''}</div>`).join('');
  tip.classList.add('on');
});

render();
})();
</script>
</body>
</html>
